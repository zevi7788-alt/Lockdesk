<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LockDesk">
<title>LockDesk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='10' width='18' height='12' rx='2' fill='%23a8781f'/%3E%3Cpath d='M7 10V7a5 5 0 0 1 10 0v3' stroke='%23a8781f' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>/* LockDesk: field-service dispatch. Steel-slate neutrals, one brass accent from the trade, semantic status colors. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #141a24;
  --ink-2: #4a5466;
  --ink-3: #7b8597;
  --line: #dde1e8;
  --line-2: #c9cfd9;
  --brand: #1b2433;
  --brand-ink: #ffffff;
  --brass: #a8781f;
  --link: #2456a6;
  --focus: #2f6fd6;

  --st-new: #3b5b92;      --st-new-bg: #e6edf8;
  --st-sched: #5a4fa3;    --st-sched-bg: #ece9f8;
  --st-assigned: #22717a; --st-assigned-bg: #e1f1f2;
  --st-otw: #9a5b00;      --st-otw-bg: #fdf0d8;
  --st-arrived: #1f5fbf;  --st-arrived-bg: #e2ecfb;
  --st-done: #1d7a43;     --st-done-bg: #e2f3e8;
  --st-cancel: #6b7280;   --st-cancel-bg: #eceef1;
  --red: #c62828;         --red-bg: #fde8e8;
  --amber: #b45309;       --amber-bg: #fff1dc;

  --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1218; --surface: #161c25; --surface-2: #1b222d; --ink: #e8ecf2; --ink-2: #aab3c2; --ink-3: #7d8798;
    --line: #262f3c; --line-2: #343f4f; --brand: #e8ecf2; --brand-ink: #0e1218; --brass: #d4a24a; --link: #7fb0ff; --focus: #7fb0ff;
    --st-new: #9cb8ec; --st-new-bg: #1d2a42; --st-sched: #b9b0f2; --st-sched-bg: #272444; --st-assigned: #7fd0d8; --st-assigned-bg: #15333a;
    --st-otw: #ffc266; --st-otw-bg: #3a2a10; --st-arrived: #8ab8ff; --st-arrived-bg: #172a48; --st-done: #7ed6a0; --st-done-bg: #15321f;
    --st-cancel: #9aa3b2; --st-cancel-bg: #232a35; --red: #ff7b7b; --red-bg: #3d1717; --amber: #ffb35c; --amber-bg: #3a2810;
    --shadow: none; color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: var(--link); text-decoration: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 24px; font-weight: 600; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin-bottom: 10px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.sub { font-size: 13px; color: var(--ink-3); }
.r { text-align: right; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font: 500 14px var(--font); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn.big { min-height: 48px; font-size: 16px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--link); font: inherit; cursor: pointer; }
.link.small { font-size: 13px; }

/* Badges */
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font: 600 11px var(--font); letter-spacing: .05em; text-transform: uppercase; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.st-new { background: var(--st-new-bg); color: var(--st-new); }
.st-scheduled { background: var(--st-sched-bg); color: var(--st-sched); }
.st-assigned { background: var(--st-assigned-bg); color: var(--st-assigned); }
.st-on_the_way { background: var(--st-otw-bg); color: var(--st-otw); }
.st-arrived { background: var(--st-arrived-bg); color: var(--st-arrived); }
.st-completed { background: var(--st-done-bg); color: var(--st-done); }
.st-cancelled { background: var(--st-cancel-bg); color: var(--st-cancel); }
.pr-emergency { background: var(--red); color: #fff; }
.pr-high { background: var(--red-bg); color: var(--red); }
.pr-low { background: var(--surface-2); color: var(--ink-3); }
.pay-unpaid, .pay-pending { background: var(--amber-bg); color: var(--amber); }
.pay-paid { background: var(--st-done-bg); color: var(--st-done); }
.pay-refunded, .pay-voided { background: var(--st-cancel-bg); color: var(--st-cancel); }
.role-owner { background: var(--brand); color: var(--brand-ink); }
.role-technician { background: var(--st-assigned-bg); color: var(--st-assigned); }
.new-dot { background: var(--amber-bg); color: var(--amber); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.asap { color: var(--red); font-weight: 600; }

/* Shell */
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; padding: 0 8px; color: var(--ink); }
.brand.big { font-size: 24px; padding: 0; margin-bottom: 4px; }
.mark { width: 22px; height: 22px; color: var(--brass); }
.brand.big .mark { width: 30px; height: 30px; }
.side nav { display: flex; flex-direction: column; gap: 2px; margin-top: 22px; }
.side nav a { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: 6px; color: var(--ink-2); font-weight: 500; }
.side nav a:hover { background: var(--surface-2); color: var(--ink); }
.side nav a.on { background: var(--surface-2); color: var(--ink); box-shadow: inset 3px 0 0 var(--brass); }
.nav-n { font: 600 11px var(--mono); background: var(--amber-bg); color: var(--amber); border-radius: 10px; padding: 1px 7px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 0 8px; }
.me { display: flex; flex-direction: column; font-size: 13px; }
.live { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.live.on::before { background: var(--st-done); }
.topbar, .scrim { display: none; }
.main { min-width: 0; }
.page { max-width: 1240px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumbs { font-size: 13px; color: var(--ink-3); }
.loading, .splash { padding: 40px; color: var(--ink-3); }
.splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.splash .mark { width: 40px; height: 40px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink); }
a.stat:hover { border-color: var(--line-2); }
.stat-v { font-size: 24px; font-weight: 600; }
.stat-k { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.stat.warn .stat-v { color: var(--amber); }

/* Board */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px 16px; align-items: start; }
.section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: center; }
.count { margin-left: 8px; font: 600 12px var(--mono); color: var(--ink-3); }
.cards { display: grid; gap: 8px; }
.empty { padding: 16px; border: 1px dashed var(--line-2); border-radius: var(--r); color: var(--ink-3); font-size: 14px; text-align: center; }

.jobcard { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink); box-shadow: var(--shadow); }
.jobcard:hover { border-color: var(--line-2); }
.jobcard.is-emergency { border-color: var(--red); box-shadow: inset 4px 0 0 var(--red); }
.jc-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.jc-num { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.jc-name { font-weight: 600; font-size: 16px; }
.jc-line { color: var(--ink-2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jc-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }

/* Toolbar, chips, table, list */
.toolbar { display: flex; flex-direction: column; gap: 10px; }
.search { width: 100%; max-width: 480px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 13px; font-weight: 500; background: var(--surface); }
.chip .mono { color: var(--ink-3); margin-left: 4px; }
.chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.chip.on .mono { color: inherit; opacity: .7; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tbody tr { cursor: pointer; }
.table tbody tr:hover { background: var(--surface-2); }
.table tr:last-child td { border-bottom: 0; }
.row-emergency td:first-child { box-shadow: inset 4px 0 0 var(--red); }
.mobile-only { display: none; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.list.compact { border: 0; background: none; margin-top: 8px; }
.list-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--ink); align-items: center; }
.list-row:last-child { border-bottom: 0; }
a.list-row:hover { background: var(--surface-2); }
.list-row > div { min-width: 0; }

/* Detail */
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-of-type { border-bottom: 0; }
.kv .k { color: var(--ink-3); font-size: 13px; }
.kv .v { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.payrow { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; padding: 6px 0; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 7px 0; border-left: 2px solid var(--line); padding-left: 12px; position: relative; font-size: 14px; }
.timeline li::before { content: ''; position: absolute; left: -5px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.timeline li:last-child::before { background: var(--brass); }
.timeline .t { color: var(--ink-3); font-size: 12px; padding-top: 2px; }
.note-pending { margin: 0 0 8px; font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--amber-bg); color: var(--amber); }
.sms { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sms-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 12px; }

/* Forms */
input, select, textarea { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); color: var(--ink); font: 15px var(--font); }
textarea { resize: vertical; line-height: 1.4; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
.big-input { font-size: 26px; min-height: 56px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide, .wide { grid-column: 1 / -1; }
.flabel { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.fhint { font-size: 12px; color: var(--ink-3); }
.form-page { max-width: 900px; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; margin: 0; display: flex; flex-direction: column; gap: 14px; }
legend { padding: 0 6px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid.four { grid-template-columns: repeat(4, 1fr); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; background: var(--surface); flex-wrap: nowrap; }
.seg.wrap { flex-wrap: wrap; }
.seg button { flex: 1; min-height: 40px; padding: 0 14px; border: 0; border-right: 1px solid var(--line-2); background: transparent; color: var(--ink-2); font: 500 14px var(--font); cursor: pointer; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--brand); color: var(--brand-ink); }
.seg button.on.p-emergency { background: var(--red); color: #fff; }
.seg button.on.p-high { background: var(--red-bg); color: var(--red); }
.seg.small button { padding: 0 10px; font-size: 13px; }
.asap-toggle { min-height: 42px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); color: var(--ink-2); font: 600 14px var(--font); cursor: pointer; }
.asap-toggle.on { background: var(--red); border-color: var(--red); color: #fff; }
.matches { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--surface-2); border-radius: 6px; }
.match { text-align: left; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; color: var(--ink); font: 14px var(--font); display: flex; gap: 10px; flex-wrap: wrap; }
.match:hover { border-color: var(--focus); }
.picked { font-size: 13px; color: var(--st-done); }
.form-foot { display: flex; justify-content: flex-end; gap: 8px; }
.alert { padding: 10px 12px; border-radius: 6px; font-size: 14px; }
.alert.err { background: var(--red-bg); color: var(--red); }
.alert.ok { background: var(--st-done-bg); color: var(--st-done); }
.banner { margin: 16px 24px 0; }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { width: 100%; max-width: 440px; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; }
.modal-head h3 { margin: 0; }

/* Calendar */
.month { min-width: 150px; text-align: center; }
.cal-wrap { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.cal-h { background: var(--surface-2); text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 8px 0; font-weight: 600; }
.cal-c { position: relative; background: var(--surface); border: 0; min-height: 84px; padding: 6px 8px; text-align: left; display: flex; flex-direction: column; gap: 4px; cursor: pointer; color: var(--ink); font: 13px var(--font); }
.cal-c.out { color: var(--ink-3); background: var(--surface-2); }
.cal-c.today .cal-d { background: var(--brand); color: var(--brand-ink); border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
.cal-c.sel { box-shadow: inset 0 0 0 2px var(--brass); }
.cal-d { font-family: var(--mono); font-weight: 600; }
.cal-n { font-size: 12px; background: var(--st-new-bg); color: var(--st-new); border-radius: 4px; padding: 1px 6px; align-self: flex-start; }
.cal-dot { position: absolute; top: 9px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.agenda { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.ag-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 14px; }
.ag-b { min-width: 0; }
.ag-b .sub { display: block; }
.ag-t { font-size: 13px; padding-top: 1px; }

/* Reports */
.report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 120px 1fr; grid-template-rows: auto auto; column-gap: 10px; font-size: 14px; }
.bar-k { grid-row: span 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; align-self: center; }
.bar-fill { display: block; height: 100%; background: var(--brass); border-radius: 4px; }
.bar-v { font-size: 13px; }
.mapping { display: flex; flex-direction: column; font-size: 13px; }
.mapping div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }

/* Login */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.login-card { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
.login-card p { margin: 0; }
.login-links { display: flex; justify-content: space-between; font-size: 14px; }

/* Toasts */
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 100; width: min(440px, calc(100vw - 32px)); }
.toast { padding: 12px 14px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-size: 14px; font-weight: 500; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.toast.err { background: var(--red); color: #fff; }

/* ---------- Technician ---------- */
.tech-shell { min-height: 100vh; max-width: 560px; margin: 0 auto; }
.tech-top { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.tech-top .brand { padding: 0; }
.tech-top-r { display: flex; gap: 4px; align-items: center; }
.tech { padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
.tech-hello { font-size: 22px; font-weight: 600; }
.active-job { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 16px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font: inherit; cursor: pointer; }
.aj-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .75; font-weight: 600; }
.aj-name { font-size: 20px; font-weight: 600; }
.aj-addr { opacity: .85; }
.aj-go { margin-top: 6px; font-weight: 600; color: var(--brass); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.tabs button { min-height: 46px; border: 0; border-right: 1px solid var(--line-2); background: transparent; font: 600 15px var(--font); color: var(--ink-2); cursor: pointer; }
.tabs button:last-child { border-right: 0; }
.tabs button.on { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 -3px 0 var(--brass); }
.tabs .mono { font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.tech-list { display: flex; flex-direction: column; gap: 10px; }
.tcard { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; box-shadow: var(--shadow); }
.tcard.is-emergency { border-color: var(--red); box-shadow: inset 5px 0 0 var(--red); }
.tc-top { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.tc-name { font-size: 18px; font-weight: 600; }
.tc-line { color: var(--ink-2); }
.tc-when { margin-top: 4px; font-weight: 600; font-size: 14px; }
.back { align-self: flex-start; background: none; border: 0; color: var(--link); font: 600 16px var(--font); padding: 4px 0; cursor: pointer; }
.tj-head { display: flex; flex-direction: column; gap: 6px; }
.tj-head h1 { font-size: 26px; }
.tj-when { font-size: 16px; font-weight: 600; color: var(--ink-2); }
.tj-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tbtn { display: flex; flex-direction: column; gap: 2px; padding: 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 17px; min-width: 0; }
.tbtn span { font-size: 13px; font-weight: 400; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tj-primary { display: flex; flex-direction: column; }
.bigbtn { width: 100%; min-height: 72px; border: 0; border-radius: 14px; font: 700 22px var(--font); letter-spacing: .04em; color: #fff; cursor: pointer; }
.bigbtn:disabled { opacity: .6; }
.bigbtn.accept { background: #22717a; }
.bigbtn.otw { background: #b26a00; }
.bigbtn.arrived { background: #1f5fbf; }
.bigbtn.complete { background: #1d7a43; }
.done-box { padding: 18px; border-radius: 14px; background: var(--st-done-bg); color: var(--st-done); font-weight: 600; font-size: 18px; text-align: center; }
.tj-info { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.ti { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ti:last-child { border-bottom: 0; }
.ti .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .detail, .cal-wrap { grid-template-columns: 1fr; }
  .grid.four { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: 260px; height: auto; transform: translateX(-100%); transition: transform .2s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .menu-open .side { transform: none; }
  .menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 30; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 20; justify-content: space-between; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar .brand { padding: 0; }
  .page { padding: 16px 16px 64px; gap: 16px; }
  .banner { margin: 12px 16px 0; }
  .desktop-only { display: none; }
  .mobile-only { display: grid; }
  .board { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .grid, .grid.four { grid-template-columns: 1fr; }
  .seg { display: flex; width: 100%; }
  .seg.small { flex-wrap: wrap; }
  .page-head .seg { overflow-x: auto; }
  .report-grid { grid-template-columns: 1fr; }
  .cal-c { min-height: 54px; padding: 4px; }
  .cal-n { font-size: 0; padding: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--st-new); }
  .kv { grid-template-columns: 96px 1fr; }
  .form-foot .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Parts */
.part-needed { background: var(--amber-bg); color: var(--amber); }
.part-ordered { background: var(--st-sched-bg); color: var(--st-sched); }
.part-received { background: var(--st-assigned-bg); color: var(--st-assigned); }
.part-installed { background: var(--st-done-bg); color: var(--st-done); }
.part-cancelled { background: var(--st-cancel-bg); color: var(--st-cancel); }
.parts { display: flex; flex-direction: column; gap: 10px; }
.part-list { display: flex; flex-direction: column; }
.part { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.part:last-child { border-bottom: 0; }
.part.cancelled .part-name { text-decoration: line-through; color: var(--ink-3); }
.part-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.part-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.part-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.part-total { display: flex; justify-content: space-between; font-size: 14px; padding-top: 4px; }
.pre { white-space: pre-wrap; }
.setup { display: flex; flex-direction: column; gap: 10px; }
.setup p { margin: 0; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.sql { font-size: 12px; min-height: 0; }
.tj-parts { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.tj-sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
@media (max-width: 760px) { .part { flex-direction: column; } .part-side { align-items: flex-start; } .part-actions { justify-content: flex-start; } }
</style>
