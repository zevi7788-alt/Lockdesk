-- Apply a new tax rate to invoices that are still open and haven't been hand edited
create or replace function public.ld_apply_tax_to_open_invoices() returns integer
language plpgsql security definer set search_path = public as $$
declare v_rate numeric; n integer;
begin
  if not public.ld_is_owner() then raise exception 'Only the owner can change tax.'; end if;
  select tax_rate into v_rate from public.ld_company limit 1;
  update public.invoices
     set tax_rate = v_rate, tax = round(subtotal * v_rate, 2), total = subtotal + round(subtotal * v_rate, 2), updated_at = now()
   where status = 'open' and tax_rate is distinct from v_rate;
  get diagnostics n = row_count;
  return n;
end $$;
revoke all on function public.ld_apply_tax_to_open_invoices() from public, anon;
grant execute on function public.ld_apply_tax_to_open_invoices() to authenticated;

-- =====================================================================
-- Delete a job (owner only): removes the job and everything attached to
-- it (invoice, payments, parts, timeline, texts, attachments).
-- =====================================================================
create or replace function public.ld_delete_job(p_job text) returns void
language plpgsql security definer set search_path = public as $$
declare t text;
begin
  if not public.ld_is_owner() then raise exception 'Only the owner can delete jobs.'; end if;
  if not exists (select 1 from public.jobs j where j.id::text = p_job) then raise exception 'Job not found.'; end if;
  foreach t in array array['payments','invoices','job_parts','job_events','notifications','job_attachments'] loop
    if to_regclass('public.' || t) is not null and exists (
      select 1 from information_schema.columns where table_schema = 'public' and table_name = t and column_name = 'job_id') then
      execute format('delete from public.%I where job_id::text = $1', t) using p_job;
    end if;
  end loop;
  delete from public.jobs j where j.id::text = p_job;
end $$;
revoke all on function public.ld_delete_job(text) from public, anon;
grant execute on function public.ld_delete_job(text) to authenticated;

-- Delete a customer and all of their jobs (owner only)
create or replace function public.ld_delete_customer(p_customer text) returns integer
language plpgsql security definer set search_path = public as $$
declare r record; n integer := 0;
begin
  if not public.ld_is_owner() then raise exception 'Only the owner can delete customers.'; end if;
  if exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'jobs' and column_name = 'customer_id') then
    for r in execute 'select id::text as id from public.jobs where customer_id::text = $1' using p_customer loop
      perform public.ld_delete_job(r.id);
      n := n + 1;
    end loop;
  end if;
  if to_regclass('public.notifications') is not null and exists (
    select 1 from information_schema.columns where table_schema = 'public' and table_name = 'notifications' and column_name = 'customer_id') then
    execute 'delete from public.notifications where customer_id::text = $1' using p_customer;
  end if;
  if to_regclass('public.invoices') is not null then
    delete from public.invoices where customer_id::text = p_customer;
  end if;
  delete from public.customers c where c.id::text = p_customer;
  return n;
end $$;
revoke all on function public.ld_delete_customer(text) from public, anon;
grant execute on function public.ld_delete_customer(text) to authenticated;

-- =====================================================================
-- Technicians only see jobs assigned to them (enforced by the database)
-- and only the customers, invoices-free details, parts, timeline and
-- texts that belong to those jobs. Office staff are unaffected.
-- =====================================================================
create or replace function public.ld_is_tech() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select p.approved and p.role::text = 'technician' from public.profiles p where p.id = auth.uid()), false)
$$;
grant execute on function public.ld_is_tech() to anon, authenticated;

do $$
declare
  techcol text;
  t text;
begin
  select c into techcol from unnest(array['assigned_technician_id','technician_id','assigned_to','assigned_tech_id','tech_id','assigned_technician']) c
   where exists (select 1 from information_schema.columns where table_schema='public' and table_name='jobs' and column_name=c)
   limit 1;
  if techcol is null then
    raise warning 'LockDesk: no technician column found on jobs; technician scoping skipped';
    return;
  end if;

  -- Helper: is this job assigned to the signed in technician?
  execute format($f$
    create or replace function public.ld_my_job(p_job text) returns boolean
    language sql stable security definer set search_path = public as $q$
      select exists (select 1 from public.jobs j where j.id::text = p_job and j.%I::text = auth.uid()::text)
    $q$;$f$, techcol);
  grant execute on function public.ld_my_job(text) to authenticated;

  drop policy if exists ld_tech_scope on public.jobs;
  execute format('create policy ld_tech_scope on public.jobs as restrictive for all to public
    using (not public.ld_is_tech() or %1$I::text = auth.uid()::text)
    with check (not public.ld_is_tech() or %1$I::text = auth.uid()::text)', techcol);

  if exists (select 1 from information_schema.columns where table_schema='public' and table_name='jobs' and column_name='customer_id') then
    drop policy if exists ld_tech_scope on public.customers;
    execute format('create policy ld_tech_scope on public.customers as restrictive for all to public
      using (not public.ld_is_tech() or exists (select 1 from public.jobs j where j.customer_id::text = customers.id::text and j.%1$I::text = auth.uid()::text))
      with check (not public.ld_is_tech())', techcol);
  end if;

  foreach t in array array['job_events','payments','notifications','job_attachments','job_parts'] loop
    if to_regclass('public.' || t) is not null and exists (
      select 1 from information_schema.columns where table_schema='public' and table_name=t and column_name='job_id') then
      execute format('drop policy if exists ld_tech_scope on public.%I', t);
      execute format('create policy ld_tech_scope on public.%I as restrictive for all to public
        using (not public.ld_is_tech() or public.ld_my_job(job_id::text))
        with check (not public.ld_is_tech() or public.ld_my_job(job_id::text))', t);
    end if;
  end loop;
end $$;
